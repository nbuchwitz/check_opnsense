[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
lint.select = [
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # Pyflakes
    "Q",   # flake8-quotes
]
lint.ignore = [
    "D107", # undocumented-public-init
    # Resolve the conflicting pydocstyle rule pairs ruff would otherwise warn about
    "D203", # incorrect-blank-line-before-class, conflicts with D211
    "D213", # multi-line-summary-second-line, conflicts with D212
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test helpers and cases do not need full annotations or per-case docstrings.
"tests/*" = ["ANN", "D102", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
